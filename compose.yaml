name: elsewhen
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: elsewhen
      POSTGRES_USER: elsewhen
      POSTGRES_PASSWORD: elsewhen
    ports:
      - "127.0.0.1:55437:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elsewhen -d elsewhen"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
