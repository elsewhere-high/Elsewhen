name: elsewhen-tests
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: elsewhen_test
      POSTGRES_USER: elsewhen_test
      POSTGRES_PASSWORD: elsewhen_test
    ports:
      - "127.0.0.1:55438:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elsewhen_test -d elsewhen_test"]
      interval: 3s
      timeout: 3s
      retries: 20
